name: Support and adoption question
description: Ask for help using or evaluating base-cli
title: "support: "
labels:
  - adoption support
body:
  - type: markdown
    attributes:
      value: |
        For general ecosystem questions, prefer Base Discussions. Do not include secrets or security-sensitive details here.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include Python, Click/Typer, OS, architecture, and relevant extras.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal and evidence
      description: What are you trying to do, what did you try, and what happened?
    validations:
      required: true
