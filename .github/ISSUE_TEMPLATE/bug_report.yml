name: Bug report
description: Report a reproducible base-cli defect
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, personal data, or vulnerability details. Use SECURITY.md for private reports.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include the installed release, package revision, or commit.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include Python, Click/Typer, OS, architecture, and relevant extras.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Give the smallest command, fixture, or test that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Redact credentials, tokens, personal data, and private paths.
      render: text
