[build-system]
requires = ["setuptools>=68,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "base-cli-reference-minimal"
version = "0.1.0"
description = "Minimal production-style base-cli reference application"
requires-python = ">=3.10"
dependencies = ["base-cli>=0.3"]

[project.scripts]
base-minimal = "minimal_cli.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
