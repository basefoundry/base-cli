[build-system]
requires = ["setuptools>=68,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "base-cli-reference-typer"
version = "0.1.0"
description = "Typed Typer base-cli reference application"
requires-python = ">=3.10"
dependencies = [
  "base-cli>=0.3",
  "typer>=0.12,<0.26",
]

[project.scripts]
base-typer = "typer_app.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
