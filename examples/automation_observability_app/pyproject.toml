[build-system]
requires = ["setuptools>=68,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "base-cli-reference-automation"
version = "0.1.0"
description = "Automation and observability base-cli reference application"
requires-python = ">=3.10"
dependencies = [
  "base-cli>=0.3",
  "click>=8.1",
]

[project.optional-dependencies]
observability = [
  "rich>=13.7,<15",
  "opentelemetry-api>=1.24,<2",
]

[project.scripts]
base-automation = "automation_observability_app.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
