[build-system]
# Keep the generated core metadata at 2.3 until the pinned publisher action's
# bundled twine/pkginfo stack accepts Metadata-Version 2.4.
requires = ["setuptools>=68,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "base-cli"
dynamic = ["version"]
description = "A small, consumer-neutral Python CLI framework"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Base Foundry" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "click>=8.1",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.17,<2",
  "pytest>=8.0",
]
typer = [
  # Typer 0.26+ ships a private Click fork; base-cli intentionally supports
  # the public Click command classes through Typer 0.25.x for now.
  "typer>=0.12,<0.26",
]

[project.urls]
Homepage = "https://github.com/basefoundry/base-cli"
Repository = "https://github.com/basefoundry/base-cli"
Issues = "https://github.com/basefoundry/base-cli/issues"

[tool.setuptools]
package-dir = {"" = "lib/python"}

[tool.setuptools.packages.find]
where = ["lib/python"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.package-data]
base_cli = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["lib/python"]
