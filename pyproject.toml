[build-system]
# Keep the generated core metadata at 2.3 until the pinned publisher action's
# bundled twine/pkginfo stack accepts Metadata-Version 2.4.
requires = ["setuptools>=68,<77"]
build-backend = "setuptools.build_meta"

[project]
name = "base-cli"
dynamic = ["version"]
description = "The production lifecycle layer for Click and Typer Python CLIs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = [
  "cli",
  "python-cli",
  "command-line",
  "command-line-interface",
  "cli-framework",
  "click",
  "typer",
  "framework",
  "lifecycle",
  "logging",
  "structured-logging",
  "configuration",
]
authors = [
  { name = "Base Foundry" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: System :: Shells",
]
dependencies = [
  "click>=8.1,<8.6",
]

[project.optional-dependencies]
yaml = [
  "PyYAML>=6.0,<7",
]
dev = [
  "build>=1.2",
  "hypothesis>=6.100,<7",
  "mypy>=1.17,<2",
  "PyYAML>=6.0,<7",
  "pytest>=8.0",
  "types-PyYAML>=6.0,<7",
]
typer = [
  # Typer 0.26+ ships a private Click fork; the adapter selects the matching
  # Click dialect so both pre-fork and vendored-Typer command trees work.
  "typer>=0.12,<0.28",
]
rich = [
  "rich>=13.7,<15",
]
telemetry = [
  "opentelemetry-api>=1.24,<2",
]
quality = [
  "bandit>=1.7,<2",
  "coverage[toml]>=7.6,<8",
  "pip-audit>=2.7,<3",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]
docs = [
  "mkdocs-material>=9.5,<10",
]

[project.urls]
Homepage = "https://github.com/basefoundry/base-cli"
Repository = "https://github.com/basefoundry/base-cli"
Issues = "https://github.com/basefoundry/base-cli/issues"
Documentation = "https://basefoundry.github.io/base-cli/"
"Code of Conduct" = "https://github.com/basefoundry/base-cli/blob/main/CODE_OF_CONDUCT.md"

[tool.setuptools]
package-dir = {"" = "lib/python"}

[tool.setuptools.packages.find]
where = ["lib/python"]

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools.package-data]
base_cli = ["py.typed", "schemas/v1/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["lib/python"]

[tool.mypy]
python_version = "3.10"
# Type-check the portable POSIX baseline consistently across CI runners. The
# runtime suite still exercises native Windows behavior separately.
platform = "linux"
strict = true
warn_unused_ignores = true
mypy_path = ["lib/python"]

[[tool.mypy.overrides]]
module = ["opentelemetry", "opentelemetry.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["base_cli"]

[tool.coverage.report]
fail_under = 80
exclude_also = [
  "if __name__ == .__main__.:",
  "pragma: no cover",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
ignore = ["E402", "E501"]
